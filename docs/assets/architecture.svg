<g class="label"><text x="124" y="269">采集</text><text x="124" y="377">解决</text><text x="124" y="485">证据生产</text><text x="124" y="593">核心</text><text x="124" y="701">信息服务</text></g>
<g class="en"><text x="124" y="300">Acquisition / Capture</text><text x="124" y="408">Resolution</text><text x="124" y="516">Evidence Production</text><text x="124" y="624">Core</text><text x="124" y="732">Information Services</text></g>
<g class="body"><text x="407" y="270">获准的工作事件、材料与主要环境</text><text x="407" y="300">实际观察和模型整理分别保留</text><text x="407" y="378">阅读背景、找方法、联系与协作</text><text x="407" y="408">人与自己的 AI 使用获准工具继续工作</text><text x="407" y="486">尝试、介入、输出、检查与实际结果</text><text x="407" y="516">有限交付与整体目标解决分别记录</text><text x="407" y="594">稳定身份、控制、历史与可复用方法</text><text x="407" y="624">保留出具者、来源、版本和使用范围</text><text x="407" y="702">发现、查询、阅读、比较与变化关注</text><text x="407" y="732">按当前权限取得信息</text></g>
<rect x="44" y="783" width="1112" height="74" rx="12" fill="#f8f8fa"/>
<text x="66" y="813" class="small">实现载体：Core / Node / Native · Web · Hub API / Worker · 协议与外部服务适配</text>
<text x="66" y="842" class="small">职责图不等于部署清单；具体可用范围以组件、发行与实际验证为准。</text>
