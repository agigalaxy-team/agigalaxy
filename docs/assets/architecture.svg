<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
<title id="title">银河五层职责与接入</title>
<desc id="description">网页、自己的 AI 和本地客户端共享采集、解决、证据生产、核心及信息服务职责。五层是责任划分，不要求部署为五个独立服务。</desc>
<style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;fill:#24242b}.title{font-size:32px;font-weight:700}.sub{font-size:21px;fill:#676673}.label{font-size:25px;font-weight:650}.body{font-size:22px;fill:#53525e}.en{font-size:18px;fill:#817785}.number{font-size:22px;fill:#a74272;font-weight:650}.small{font-size:20px;fill:#676673}</style>
