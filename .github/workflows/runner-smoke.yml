name: Runner Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Show runner identity
        shell: bash
        run: |
          set -euxo pipefail
          echo "runner-ok"
          hostname
          whoami
          uname -a
          pwd
