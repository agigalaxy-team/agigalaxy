name: Component builds and integration checks

on:
  pull_request:
  push:
    branches: [main, reconstruction/full-product-20261012]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if test -n "$BASE" && test "$BASE" != 0000000000000000000000000000000000000000; then
            node scripts/components.mjs plan --base "$BASE" --output component-plan.json
          else
            node -e "require('fs').writeFileSync('component-inputs.json',JSON.stringify(['repository-components.json']))"
            node scripts/components.mjs plan --files component-inputs.json --output component-plan.json
          fi
          node -e "let p=require('./component-plan.json');require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'matrix='+JSON.stringify({include:p.include})+'\n')"
  component:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - if: matrix.component != 'agentos' && matrix.component != 'model-gateway' && matrix.component != 'discovery'
        run: npm run setup
      - if: matrix.component == 'admin'
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix apps/galaxy-admin
      - run: node scripts/components.mjs check --component ${{ matrix.component }} --output outputs/check-${{ matrix.component }}
      - if: matrix.component != 'admin'
        run: node scripts/components.mjs build --component ${{ matrix.component }} --output outputs/build-${{ matrix.component }}
      - if: matrix.component == 'admin'
        env:
          GALAXY_ADMIN_PUBLIC_ORIGIN: http://127.0.0.1:3010
          GALAXY_ADMIN_BFF_ORIGIN: http://127.0.0.1:3011
          GALAXY_CMS_DATABASE_URL: postgresql://127.0.0.1:1/galaxy_admin_build_stub
          GALAXY_CMS_SECRET: synthetic-ci-build-only-no-runtime-credential
          GALAXY_CMS_DEV_PUSH: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
        run: node scripts/components.mjs build --component admin --output outputs/build-admin
      - if: matrix.component == 'web'
        run: node node_modules/typescript/bin/tsc --noEmit
      - if: matrix.component == 'hub' || matrix.component == 'contracts'
        run: node --test --test-concurrency=2 packages/galaxy-official/test/task-material-*.test.mjs packages/galaxy-web/test/task-material-client.test.mjs
      - if: matrix.component == 'hub'
        run: node --test packages/galaxy-official/test/service-release-host.test.mjs
      - if: matrix.component == 'hub'
        run: python scripts/create-release-baseline.py
