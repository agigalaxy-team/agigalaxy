name: Component builds and integration checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: node --test scripts/test/components.test.mjs
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if test -n "$BASE" && test "$BASE" != 0000000000000000000000000000000000000000; then
            node scripts/components.mjs plan --base "$BASE" --output component-plan.json
          else
            node -e "require('fs').writeFileSync('component-inputs.json',JSON.stringify(['repository-components.json']))"
            node scripts/components.mjs plan --files component-inputs.json --output component-plan.json
          fi
          node -e "let p=require('./component-plan.json');require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'matrix='+JSON.stringify({include:p.include})+'\n')"
  component:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - if: matrix.component == 'hub' || matrix.component == 'native-client' || matrix.component == 'core' || matrix.component == 'a2a'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - if: matrix.component != 'model-gateway' && matrix.component != 'discovery'
        run: npm run setup
      - if: matrix.component == 'hub' || matrix.component == 'native-client' || matrix.component == 'core' || matrix.component == 'a2a'
        name: Locate isolated PostgreSQL integration binaries
        run: |
          PG_BIN="$(pg_config --bindir)"
          test -x "$PG_BIN/initdb"
          test -x "$PG_BIN/pg_ctl"
          echo "GALAXY_GO_TEST_PG_BIN=$PG_BIN" >> "$GITHUB_ENV"
      - if: matrix.component == 'admin'
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix apps/galaxy-admin
      - if: matrix.component == 'admin' || matrix.component == 'native-client'
        name: Prepare isolated Chromium for current browser tests
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - if: matrix.component == 'native-client'
        name: Build the current compact interface used by Native checks
        run: node integrations/native-v2/compact-app/build.mjs
      - if: matrix.component == 'a2a'
        name: Compile the current Go peer before its HTTP startup timeout
        run: |
          go -C go test -c -tags galaxy_a2a_fixture -o "$RUNNER_TEMP/galaxy-a2a-fixture" ./internal/testsupport/a2afixture
          echo "GALAXY_A2A_FIXTURE_BINARY=$RUNNER_TEMP/galaxy-a2a-fixture" >> "$GITHUB_ENV"
      - if: matrix.component == 'a2a'
        name: Prepare the locked Python peer for current Go HTTP integration
        run: |
          python -m venv "$RUNNER_TEMP/galaxy-a2a-python"
          "$RUNNER_TEMP/galaxy-a2a-python/bin/python" -m pip install --disable-pip-version-check --require-hashes --no-deps \
            -r packages/galaxy-a2a/test/python/requirements.lock
          "$RUNNER_TEMP/galaxy-a2a-python/bin/python" -m pip check
          echo "GALAXY_A2A_PYTHON=$RUNNER_TEMP/galaxy-a2a-python/bin/python" >> "$GITHUB_ENV"
      - if: matrix.component == 'auth'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - if: matrix.component == 'auth'
        name: Compile and test the fixed Keycloak providers
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/keycloak-26.7.3.tar.gz" \
            https://github.com/keycloak/keycloak/releases/download/26.7.3/keycloak-26.7.3.tar.gz
          tar --extract --gzip --file "$RUNNER_TEMP/keycloak-26.7.3.tar.gz" --directory "$RUNNER_TEMP"
          node scripts/ci/build-auth-providers.mjs --keycloak-dir "$RUNNER_TEMP/keycloak-26.7.3" \
            --jdk-dir "$JAVA_HOME" --output "$RUNNER_TEMP/auth-providers"
      - if: matrix.component == 'agentos'
        name: Install locked AgentOS dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r services/galaxy-operations-agentos/requirements.lock
          python -m pip check
      - if: matrix.component == 'agentos'
        name: Prepare isolated PostgreSQL test database
        run: |
          docker run --detach --rm --name galaxy-agentos-ci \
            --publish 127.0.0.1:55432:5432 \
            --env POSTGRES_PASSWORD=synthetic-ci-postgres-only postgres:17.6-bookworm
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec galaxy-agentos-ci pg_isready --username postgres; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          docker exec --interactive galaxy-agentos-ci psql --username postgres --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE galaxy_agentos_test_role LOGIN PASSWORD 'synthetic-ci-agentos-only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT;
          CREATE DATABASE galaxy_agentos_test_db OWNER galaxy_agentos_test_role;
          REVOKE ALL ON DATABASE galaxy_agentos_test_db FROM PUBLIC;
          \connect galaxy_agentos_test_db
          CREATE SCHEMA galaxy_agentos_test_schema AUTHORIZATION galaxy_agentos_test_role;
          SQL
          echo 'GALAXY_AGENTOS_TEST_DATABASE_URL=postgresql+psycopg://galaxy_agentos_test_role:synthetic-ci-agentos-only@127.0.0.1:55432/galaxy_agentos_test_db' >> "$GITHUB_ENV"
          echo 'GALAXY_AGENTOS_TEST_DATABASE_NAME=galaxy_agentos_test_db' >> "$GITHUB_ENV"
          echo 'GALAXY_AGENTOS_TEST_ROLE=galaxy_agentos_test_role' >> "$GITHUB_ENV"
          echo 'GALAXY_AGENTOS_TEST_SCHEMA=galaxy_agentos_test_schema' >> "$GITHUB_ENV"
      - if: matrix.component == 'model-gateway'
        name: Build the fixed upstream Gateway runtime
        env:
          UV_LINK_MODE: copy
          UV_PYTHON_DOWNLOADS: never
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.5
          rustup toolchain install 1.98.0 --profile minimal
          python services/galaxy-model-gateway/prepare-source-context.py --output "$RUNNER_TEMP/gateway-context" --download
          uv sync --project "$RUNNER_TEMP/gateway-context/upstream" --python "$(command -v python)" \
            --frozen --extra proxy --no-dev --no-editable --no-install-package litellm-enterprise
          "$RUNNER_TEMP/gateway-context/upstream/.venv/bin/python" -c "import importlib.util; assert importlib.util.find_spec('litellm_enterprise') is None"
          echo "$RUNNER_TEMP/gateway-context/upstream/.venv/bin" >> "$GITHUB_PATH"
      - run: node scripts/components.mjs check --component ${{ matrix.component }} --output outputs/check-${{ matrix.component }}
      - if: matrix.component != 'admin'
        run: node scripts/components.mjs build --component ${{ matrix.component }} --output outputs/build-${{ matrix.component }}
      - if: matrix.component == 'admin'
        env:
          GALAXY_ADMIN_PUBLIC_ORIGIN: http://127.0.0.1:3010
          GALAXY_ADMIN_BFF_ORIGIN: http://127.0.0.1:3011
          GALAXY_CMS_DATABASE_URL: postgresql://127.0.0.1:1/galaxy_admin_build_stub
          GALAXY_CMS_SECRET: synthetic-ci-build-only-no-runtime-credential
          GALAXY_CMS_DEV_PUSH: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
        run: node scripts/components.mjs build --component admin --output outputs/build-admin
      - if: matrix.component == 'web'
        run: node node_modules/typescript/bin/tsc --noEmit
      - if: always() && matrix.component == 'agentos'
        name: Remove the isolated PostgreSQL container
        run: docker rm --force galaxy-agentos-ci || true
