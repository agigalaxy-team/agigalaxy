name: Runner environment check

on:
  workflow_dispatch:

permissions: {}

jobs:
  runner-healthcheck:
    name: Verify AGIGalaxy runner without deployment
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, agigalaxy, production]
    timeout-minutes: 3
    steps:
      - name: Verify identity and access boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = github-runner
          test "$(id -u)" -ne 0
          test "$(uname -m)" = x86_64
          test -d /srv/galaxy/website
          test -f /etc/caddy/Caddyfile
          test ! -w /srv/galaxy/website
          test ! -w /etc/caddy/Caddyfile
          test ! -w /etc/galaxy
          test ! -w /etc/systemd/system
          test -w "$RUNNER_TEMP"
          printf '%s\n' '{"check":"runner-environment","result":"passed","production_modified":false}'
