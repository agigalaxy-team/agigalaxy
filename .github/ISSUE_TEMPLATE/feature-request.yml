name: 使用反馈与建议
description: 提交使用问题、体验反馈、兼容性问题或功能建议
title: "[反馈] "
body:
  - type: markdown
    attributes:
      value: 请勿上传凭据、私人消息、个人资料或未公开项目材料。可复现的程序故障可使用“故障反馈”表单。
  - type: dropdown
    id: category
    attributes:
      label: 反馈类型
      options:
        - 使用问题或体验反馈
        - 功能建议
        - 安装与宿主兼容
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 你想完成什么
      description: 说明实际场景、谁会使用以及希望得到的结果
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 目前遇到的困难
      description: 已有入口或替代做法，哪里不够用
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议的方式与取舍
      description: 可提出不同方案；不确定的细节可以保持待讨论
  - type: input
    id: environment
    attributes:
      label: 版本与环境
      description: 如官网页面、客户端版本、宿主与操作系统；请移除本地用户名等私人信息
  - type: textarea
    id: references
    attributes:
      label: 参考项目或资料
      description: 可选；说明想借鉴的部分，引用不等于已经采用
